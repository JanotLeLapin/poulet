[package]
name = "poulet-ai-scratch"
version = "0.1.0"
edition = "2024"

[dependencies]
poulet-chess = { path = "../chess" }
poulet-ai-common = { path = "../ai-common" }

clap = { version = "4.5.51", features = ["derive"] }
wgpu = { version = "27.0.1" }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
rayon = "1.11.0"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["alloc"] }
rand = "0.9.2"
rand_distr = "0.5.1"
bytemuck = "1.24.0"
anyhow = "1.0.100"
